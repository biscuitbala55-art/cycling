<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Register your interest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <nav class="navbar cec-navbar">
        <div class="container cec-shell py-0">
            <a href="index.html" class="navbar-brand py-2"><i class="bi bi-bicycle"></i>Cit-E Cycling</a>
        </div>
    </nav>

    <div class="cec-shell" style="max-width:560px;">
        <a href="." class="cec-backlink"><i class="bi bi-arrow-left"></i> Back to index</a>

        <h1 class="mb-2"><i class="bi bi-person-plus-fill text-warning"></i> Register your interest</h1>
        <p class="text-muted mb-4" style="text-transform:none;font-weight:400;">Tell us a little about you and we'll keep you posted about future events.</p>

        <div class="cec-form-card">
            <form action="register.php" method="POST">
                <div class="mb-3">
                    <p class="mb-1">Firstname</p>
                    <input type="text" name="firstname" pattern="[A-Za-z\-' ]{1,50}" title="Letters, spaces, hyphens or apostrophes only (max 50 characters)"  class="form-control" required placeholder="Eg: Sam">
                </div>
                <div class="mb-3">
                    <p class="mb-1">Surname</p>
                    <input type="text" name="surname" pattern="[A-Za-z\-' ]{1,50}" title="Letters, spaces, hyphens or apostrophes only (max 50 characters)"  class="form-control" required placeholder="Eg: Smith">
                </div>
                <div class="mb-3">
                    <p class="mb-1">Email</p>
                    <input type="email" name="email" maxlength="100"  class="form-control" required placeholder="Eg: sam@example.com">
                </div>
                <div class="form-check mb-3">
                    <input type="checkbox" name="terms" value="yes"  class="form-check-input" id="termsCheck" required>
                    <label class="form-check-label text-normal" for="termsCheck" style="text-transform:none;font-weight:400;color:var(--ink);">
                        Do you accept the terms and conditions?
                    </label>
                </div>

                <button type="submit" class="btn btn-cec w-100 mt-2">Register</button>
            </form>
        </div>

        <footer class="cec-footer">Cit-E Cycling Web Portal</footer>
    </div>
</body>
</html>
