<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Login to the admin area</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>


<body>
    <nav class="navbar cec-navbar">
        <div class="container cec-shell py-0">
            <a href="index.html" class="navbar-brand py-2"><i class="bi bi-bicycle"></i>Cit-E Cycling</a>
        </div>
    </nav>

    <div class="cec-shell" style="max-width:480px;">
        <a href="." class="cec-backlink"><i class="bi bi-arrow-left"></i> Back to index</a>

        <h1 class="mb-3"><i class="bi bi-shield-lock-fill text-warning"></i> Admin login</h1>
        <p class="text-muted mb-4" style="text-transform:none;font-weight:400;">Enter your username and password to access the admin area.</p>

        <div class="cec-form-card">
            <form action="login.php" method="POST">
                <div class="mb-3">
                    <p class="mb-1">Username</p>
                    <input type="text" name="username" maxlength="10" required class="form-control" placeholder="Eg: admin">
                </div>
                <div class="mb-3">
                    <p class="mb-1">Password</p>
                    <input type="password" name="password" maxlength="15" required class="form-control" placeholder="Eg: password">
                </div>

                <button type="submit" class="btn btn-cec w-100 mt-2">Log in</button>
            </form>
        </div>

        <footer class="cec-footer">Cit-E Cycling Web Portal</footer>
    </div>
</body>
</html>
